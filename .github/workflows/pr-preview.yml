name: Mille PR Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation for the current PR state
        type: choice
        options: [deploy, cleanup, inspect-native]
        required: true
      pr:
        description: Pull request number
        type: string
        required: true
      sha:
        description: Exact current HEAD SHA of the pull request
        type: string
        required: true
  workflow_run:
    workflows: [Mille PR Events]
    types: [completed]
permissions: {}
jobs:
  inspect_native:
    name: Inspect Native Preview Git source
    if: >-
      github.repository == 'tyask/mille' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect-native'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - name: Inspect the current PR Git source
        env:
          GH_TOKEN: ${{ github.token }}
          MILLE_NATIVE_PREVIEW_INSPECT_PR: ${{ inputs.pr }}
          MILLE_NATIVE_PREVIEW_INSPECT_SHA: ${{ inputs.sha }}
        run: node --import tsx scripts/preview/inspect-native.ts
  prepare:
    if: >-
      github.repository == 'tyask/mille' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation != 'inspect-native') ||
       (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'codex/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
      deploy_target: ${{ steps.resolve.outputs.deploy_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          MILLE_PR_PREVIEW_MODE: ${{ vars.MILLE_PR_PREVIEW_MODE }}
          MILLE_NATIVE_PREVIEW_PILOTS: ${{ vars.MILLE_NATIVE_PREVIEW_PILOTS }}
        run: node --import tsx scripts/preview/prepare.ts
  notify_start:
    needs: prepare
    if: >-
      github.repository == 'tyask/mille' && github.ref == 'refs/heads/main' &&
      needs.prepare.outputs.deploy_target != '' && vars.MILLE_PR_PREVIEW_ENABLED == 'true'
    concurrency:
      group: mille-pr-preview-notification-${{ fromJSON(needs.prepare.outputs.deploy_target || '{}').number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - name: Publish the Preview start
        env:
          GH_TOKEN: ${{ github.token }}
          MILLE_PR_PREVIEW_TARGET: ${{ needs.prepare.outputs.deploy_target }}
          MILLE_PR_PREVIEW_NOTIFICATION: start
        run: node --import tsx scripts/preview/announce.ts
  preview:
    needs: prepare
    if: >-
      github.repository == 'tyask/mille' && github.ref == 'refs/heads/main' &&
      vars.MILLE_PR_PREVIEW_ENABLED == 'true' && needs.prepare.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    name: PR ${{ matrix.target.number }} ${{ matrix.target.operation }}
    concurrency:
      group: ${{ vars.MILLE_PR_PREVIEW_MODE == 'native-pilot' && 'mille-pr-native-preview-pilot' || format('mille-pr-preview-{0}', matrix.target.number) }}
      cancel-in-progress: false
      queue: max
    environment: mille-pr-preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.manage.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - id: manage
        name: Manage the verified PR Preview
        env:
          GH_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MILLE_PR_PREVIEW_ENABLED: ${{ vars.MILLE_PR_PREVIEW_ENABLED }}
          MILLE_PR_PREVIEW_MODE: ${{ vars.MILLE_PR_PREVIEW_MODE }}
          MILLE_NATIVE_PREVIEW_PILOTS: ${{ vars.MILLE_NATIVE_PREVIEW_PILOTS }}
          MILLE_NATIVE_PREVIEW_VERCEL_STORE_ID: ${{ vars.MILLE_NATIVE_PREVIEW_VERCEL_STORE_ID }}
          MILLE_NATIVE_PREVIEW_VERCEL_INTEGRATION_ID: ${{ vars.MILLE_NATIVE_PREVIEW_VERCEL_INTEGRATION_ID }}
          MILLE_NATIVE_PREVIEW_VERCEL_PRODUCT_ID: ${{ vars.MILLE_NATIVE_PREVIEW_VERCEL_PRODUCT_ID }}
          MILLE_NATIVE_PREVIEW_NEON_STANDING_BRANCH_ID: ${{ vars.MILLE_NATIVE_PREVIEW_NEON_STANDING_BRANCH_ID }}
          MILLE_NATIVE_PREVIEW_NEON_STANDING_ENDPOINT_ID: ${{ vars.MILLE_NATIVE_PREVIEW_NEON_STANDING_ENDPOINT_ID }}
          MILLE_PR_PREVIEW_TARGET: ${{ toJSON(matrix.target) }}
          MILLE_PR_PREVIEW_VERCEL_TEAM_ID: ${{ vars.MILLE_PR_PREVIEW_VERCEL_TEAM_ID }}
          MILLE_PR_PREVIEW_VERCEL_PROJECT_ID: ${{ vars.MILLE_PR_PREVIEW_VERCEL_PROJECT_ID }}
          MILLE_PR_PREVIEW_NEON_PROJECT_ID: ${{ vars.MILLE_PR_PREVIEW_NEON_PROJECT_ID }}
          MILLE_PR_PREVIEW_NEON_TEMPLATE_ID: ${{ vars.MILLE_PR_PREVIEW_NEON_TEMPLATE_ID }}
          MILLE_PR_PREVIEW_MAX_BRANCHES: ${{ vars.MILLE_PR_PREVIEW_MAX_BRANCHES }}
        run: node --import tsx scripts/preview/manage.ts
  notify_result:
    needs: [prepare, notify_start, preview]
    if: >-
      !cancelled() && github.repository == 'tyask/mille' && github.ref == 'refs/heads/main' &&
      needs.prepare.result == 'success' && needs.prepare.outputs.deploy_target != ''
    concurrency:
      group: mille-pr-preview-notification-${{ fromJSON(needs.prepare.outputs.deploy_target || '{}').number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - name: Publish the Preview result
        env:
          GH_TOKEN: ${{ github.token }}
          MILLE_PR_PREVIEW_TARGET: ${{ needs.prepare.outputs.deploy_target }}
          MILLE_PR_PREVIEW_NOTIFICATION: result
          MILLE_PR_PREVIEW_RESULT: ${{ needs.preview.result }}
          MILLE_PR_PREVIEW_READY: ${{ needs.preview.outputs.ready }}
        run: node --import tsx scripts/preview/announce.ts
