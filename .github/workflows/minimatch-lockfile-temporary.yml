name: Minimatch lockfile generation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/patch-minimatch-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Generate and report public npm lockfile
        env:
          npm_config_registry: https://registry.npmjs.org
        run: |
          npm update typescript-eslint --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const bytes = fs.readFileSync('package-lock.json');
          const raw = bytes.toString('utf8');
          if (!Buffer.from(raw, 'utf8').equals(bytes) || !raw.endsWith('\n')) throw Error('Unexpected lockfile encoding');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          if (git('hash-object', 'package.json') !== git('rev-parse', 'HEAD:package.json')) throw Error('Direct dependency manifest changed');
          const lock = JSON.parse(raw);
          const original = JSON.parse(git('show', 'HEAD:package-lock.json'));
          if (lock.lockfileVersion !== 3 || JSON.stringify(lock.packages?.['']) !== JSON.stringify(original.packages[''])) throw Error('Unexpected lock root changes');
          if (lock.packages['node_modules/typescript-eslint']?.version !== '8.73.0') throw Error('Target typescript-eslint release not resolved');
          let patched = false;
          for (const [path, entry] of Object.entries(lock.packages)) {
            if (entry.resolved) {
              const url = new URL(entry.resolved);
              if (url.origin !== 'https://registry.npmjs.org' || url.username || url.password || url.search || url.hash) throw Error('Unapproved lockfile URL');
            }
            if (/(?:^|\/)minimatch$/.test(path)) {
              if (!/^\d+\.\d+\.\d+$/.test(entry.version)) throw Error('Unexpected minimatch version');
              const [major, minor, patch] = entry.version.split('.').map(Number);
              if (major >= 7 && (major < 11 || major === 11 && minor === 0 && patch === 0)) throw Error('Advisory-affected minimatch remains');
              if (major >= 11) patched = true;
            }
          }
          if (!patched) throw Error('No patched minimatch resolved');
          const chunkSize = 3000;
          console.log('MILLE_LOCK_MANIFEST ' + JSON.stringify({
            head: git('rev-parse', 'HEAD'), baseLockBlob: git('rev-parse', 'HEAD:package-lock.json'),
            manifestBlob: git('hash-object', 'package.json'), lockBlob: git('hash-object', 'package-lock.json'),
            sha256: createHash('sha256').update(bytes).digest('hex'), bytes: bytes.length, chunks: Math.ceil(raw.length / chunkSize),
            node: process.version, npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
          }));
          for (let i = 0; i < raw.length; i += chunkSize) console.log('MILLE_LOCK_CHUNK ' + i / chunkSize + ' ' + JSON.stringify(raw.slice(i, i + chunkSize)));
          NODE
