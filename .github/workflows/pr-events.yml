name: Mille PR Events
run-name: PR event ${{ github.event.action }} ${{ github.event.pull_request.number }}
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
permissions: {}
jobs:
  notify:
    if: >-
      github.repository == 'tyask/mille' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'codex/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the PR event
        run: echo 'Mille PR event received.'
