name: Mille Post Merge
run-name: Post Merge ${{ inputs.pr || github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Merged Mille PR number to verify again
        type: string
        required: true
permissions: {}
concurrency:
  group: mille-post-merge-${{ inputs.pr || github.sha }}
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    if: github.repository == 'tyask/mille' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.prepare.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: マージ済みの案件 PR と Intent を照合
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/preview/post-merge.ts prepare

  verify:
    needs: prepare
    if: needs.prepare.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    name: PR ${{ matrix.target.number }} post-merge verification
    runs-on: ubuntu-latest
    environment: mille-pr-preview
    timeout-minutes: 47
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: main CI・本番・常設 Preview・PR 資源削除の照合
        env:
          GH_TOKEN: ${{ github.token }}
          MILLE_POST_MERGE_TASK: ${{ toJSON(matrix.target) }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          MILLE_PR_PREVIEW_VERCEL_PROJECT_ID: ${{ vars.MILLE_PR_PREVIEW_VERCEL_PROJECT_ID }}
          MILLE_PR_PREVIEW_VERCEL_TEAM_ID: ${{ vars.MILLE_PR_PREVIEW_VERCEL_TEAM_ID }}
          MILLE_PR_PREVIEW_NEON_PROJECT_ID: ${{ vars.MILLE_PR_PREVIEW_NEON_PROJECT_ID }}
          MILLE_PR_PREVIEW_NEON_TEMPLATE_ID: ${{ vars.MILLE_PR_PREVIEW_NEON_TEMPLATE_ID }}
          MILLE_PR_PREVIEW_MAX_BRANCHES: ${{ vars.MILLE_PR_PREVIEW_MAX_BRANCHES }}
        run: node --import tsx scripts/preview/post-merge.ts verify
      - name: 公開可能な照合結果を保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: post-merge-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target.number }}
          path: post-merge-result.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, verify]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.targets != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    name: PR ${{ matrix.target.number }} issue record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: mille-post-merge-issue-${{ matrix.target.metadata.issue }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: この実行の PR 照合結果を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: post-merge-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target.number }}
      - name: 案件 Issue に証跡を記録
        env:
          GH_TOKEN: ${{ github.token }}
          MILLE_POST_MERGE_TASK: ${{ toJSON(matrix.target) }}
        run: node --import tsx scripts/preview/post-merge.ts publish
