<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-label="選択式の条件と会話による献立提案"><title>選択式の条件と会話による献立提案</title><style>text{font-family:"Noto Sans CJK JP","Hiragino Sans",sans-serif}*{box-sizing:border-box}</style><rect x="0" y="0" width="1200" height="805" rx="0" fill="#FBF6EA" stroke="none"/><text x="38" y="44" font-size="25" fill="#3F2B21" font-weight="600">選択式の条件と会話による献立提案</text><text x="38" y="72" font-size="13" fill="#78634F" font-weight="400">静的な構成図・架空データ / 詳細な画面例は screen-mocks.html を参照</text><g transform="translate(30 113)"><rect x="0" y="0" width="350" height="660" rx="24" fill="#FFFDF7" stroke="#E8D9C3"/><rect x="5" y="5" width="340" height="650" rx="20" fill="#FBF6EA" stroke="none"/><text x="20" y="42" font-size="29" fill="#3F2B21" font-weight="600">mille.</text><rect x="236" y="17" width="94" height="32" rx="16" fill="#FFFDF7" stroke="#E8D9C3"/><text x="250" y="38" font-size="12" fill="#3F2B21" font-weight="400">わが家 ⌄</text><path d="M5 65h340" stroke="#E8D9C3"/><text x="20" y="105" font-size="23" fill="#3F2B21" font-weight="600">今日、何を作ろう。</text><text x="20" y="132" font-size="12" fill="#78634F" font-weight="400">対象日と食事、希望を選びます。</text><text x="20" y="170" font-size="13" fill="#3F2B21" font-weight="400">対象日・人数</text><rect x="20" y="182" width="310" height="45" rx="10" fill="#FFFDF7" stroke="#E8D9C3"/><text x="32" y="211" font-size="16" fill="#3F2B21" font-weight="400">2026/11/09　　2人分</text><text x="20" y="266" font-size="13" fill="#3F2B21" font-weight="400">使いたい食材</text><rect x="20" y="278" width="310" height="45" rx="10" fill="#FFFDF7" stroke="#E8D9C3"/><text x="32" y="307" font-size="16" fill="#3F2B21" font-weight="400">鮭、きのこ</text><text x="20" y="362" font-size="13" fill="#3F2B21" font-weight="400">調理時間</text><rect x="20" y="374" width="310" height="45" rx="10" fill="#FFFDF7" stroke="#E8D9C3"/><text x="32" y="403" font-size="16" fill="#3F2B21" font-weight="400">15分以内　30分以内</text><text x="20" y="458" font-size="13" fill="#3F2B21" font-weight="400">料理の系統</text><rect x="20" y="470" width="310" height="45" rx="10" fill="#FFFDF7" stroke="#E8D9C3"/><text x="32" y="499" font-size="16" fill="#3F2B21" font-weight="400">和食　洋食　中華</text><rect x="20" y="226" width="96" height="36" rx="8" fill="#FFFDF7" stroke="#E8D9C3"/><text x="32" y="250" font-size="13" fill="#8B4F2B" font-weight="400">朝食</text><rect x="127" y="226" width="96" height="36" rx="8" fill="#FFFDF7" stroke="#E8D9C3"/><text x="139" y="250" font-size="13" fill="#8B4F2B" font-weight="400">昼食</text><rect x="234" y="226" width="96" height="36" rx="8" fill="#FFFDF7" stroke="#E8D9C3"/><text x="246" y="250" font-size="13" fill="#8B4F2B" font-weight="400">夕食</text><rect x="5" y="590" width="340" height="65" rx="0" fill="#FFFDF7" stroke="#E8D9C3"/><rect x="18" y="603" width="314" height="36" rx="8" fill="#8B4F2B" stroke="#8B4F2B"/><text x="30" y="627" font-size="13" fill="#FFFDF7" font-weight="400">献立を提案してもらう</text></g><text x="32" y="98" font-size="14" fill="#8B4F2B" font-weight="600">条件指定 P2</text><g transform="translate(425 113)"><rect x="0" y="0" width="350" height="660" rx="24" fill="#FFFDF7" stroke="#E8D9C3"/><rect x="5" y="5" width="340" height="650" rx="20" fill="#FBF6EA" stroke="none"/><text x="20" y="42" font-size="29" fill="#3F2B21" font-weight="600">mille.</text><rect x="236" y="17" width="94" height="32" rx="16" fill="#FFFDF7" stroke="#E8D9C3"/><text x="250" y="38" font-size="12" fill="#3F2B21" font-weight="400">わが家 ⌄</text><path d="M5 65h340" stroke="#E8D9C3"/><text x="20" y="105" font-size="22" fill="#3F2B21" font-weight="600">こんな献立はいかが？</text><text x="20" y="132" font-size="11" fill="#78634F" font-weight="400">11/9夕食・2人分・30分以内・鮭</text><rect x="20" y="156" width="310" height="126" rx="10" fill="#FFFDF7" stroke="#E8D9C3"/><text x="32" y="183" font-size="14" fill="#3F2B21" font-weight="600">鮭のホイル焼き</text><text x="32" y="207" font-size="11" fill="#78634F" font-weight="400">おひたし・きのこの味噌汁</text><text x="32" y="228" font-size="11" fill="#78634F" font-weight="400">時間の目安：25分</text><rect x="32" y="238" width="286" height="36" rx="8" fill="#FFFDF7" stroke="#E8D9C3"/><text x="44" y="262" font-size="13" fill="#8B4F2B" font-weight="400">この献立にする</text><rect x="20" y="295" width="310" height="126" rx="10" fill="#FFFDF7" stroke="#E8D9C3"/><text x="32" y="322" font-size="14" fill="#3F2B21" font-weight="600">鮭ときのこの炊き込みごはん</text><text x="32" y="346" font-size="11" fill="#78634F" font-weight="400">冷ややっこ・具だくさんの汁物</text><text x="32" y="367" font-size="11" fill="#78634F" font-weight="400">時間の目安：30分</text><rect x="32" y="377" width="286" height="36" rx="8" fill="#FFFDF7" stroke="#E8D9C3"/><text x="44" y="401" font-size="13" fill="#8B4F2B" font-weight="400">この献立にする</text><rect x="20" y="434" width="310" height="126" rx="10" fill="#FFFDF7" stroke="#E8D9C3"/><text x="32" y="461" font-size="14" fill="#3F2B21" font-weight="600">鮭の照り焼き</text><text x="32" y="485" font-size="11" fill="#78634F" font-weight="400">きのこの和え物・豆腐の味噌汁</text><text x="32" y="506" font-size="11" fill="#78634F" font-weight="400">時間の目安：20分</text><rect x="32" y="516" width="286" height="36" rx="8" fill="#FFFDF7" stroke="#E8D9C3"/><text x="44" y="540" font-size="13" fill="#8B4F2B" font-weight="400">この献立にする</text><rect x="5" y="590" width="340" height="65" rx="0" fill="#FFFDF7" stroke="#E8D9C3"/><rect x="18" y="603" width="314" height="36" rx="8" fill="#8B4F2B" stroke="#8B4F2B"/><text x="30" y="627" font-size="13" fill="#FFFDF7" font-weight="400">希望を伝えて調整する</text></g><text x="427" y="98" font-size="14" fill="#8B4F2B" font-weight="600">候補の比較 P2</text><g transform="translate(820 113)"><rect x="0" y="0" width="350" height="660" rx="24" fill="#FFFDF7" stroke="#E8D9C3"/><rect x="5" y="5" width="340" height="650" rx="20" fill="#FBF6EA" stroke="none"/><text x="20" y="42" font-size="29" fill="#3F2B21" font-weight="600">mille.</text><rect x="236" y="17" width="94" height="32" rx="16" fill="#FFFDF7" stroke="#E8D9C3"/><text x="250" y="38" font-size="12" fill="#3F2B21" font-weight="400">わが家 ⌄</text><path d="M5 65h340" stroke="#E8D9C3"/><text x="20" y="105" font-size="23" fill="#3F2B21" font-weight="600">献立を調整</text><text x="20" y="132" font-size="11" fill="#78634F" font-weight="400">条件：11/9夕食・2人分・30分以内</text><rect x="20" y="158" width="288" height="80" rx="10" fill="#FFFDF7" stroke="#E8D9C3"/><text x="32" y="185" font-size="12" fill="#8B4F2B" font-weight="400">mille</text><text x="32" y="210" font-size="13" fill="#3F2B21" font-weight="400">鮭のホイル焼きはいかがでしょう。</text><rect x="59" y="260" width="270" height="60" rx="10" fill="#F3E5CA" stroke="#E8D9C3"/><text x="72" y="287" font-size="12" fill="#3F2B21" font-weight="400">副菜だけ、火を使わないものにして。</text><rect x="20" y="342" width="309" height="217" rx="10" fill="#FFFDF7" stroke="#E8D9C3"/><text x="32" y="368" font-size="12" fill="#8B4F2B" font-weight="400">mille</text><text x="32" y="396" font-size="14" fill="#3F2B21" font-weight="400">副菜を酢の物に変更しました。</text><text x="32" y="432" font-size="16" fill="#3F2B21" font-weight="600">鮭のホイル焼き</text><text x="32" y="459" font-size="13" fill="#3F2B21" font-weight="400">きゅうりとわかめの酢の物</text><text x="32" y="486" font-size="13" fill="#3F2B21" font-weight="400">きのこの味噌汁</text><rect x="32" y="507" width="285" height="36" rx="8" fill="#FFFDF7" stroke="#E8D9C3"/><text x="44" y="531" font-size="13" fill="#8B4F2B" font-weight="400">この献立を予定にする</text><rect x="5" y="590" width="340" height="65" rx="0" fill="#FFFDF7" stroke="#E8D9C3"/><rect x="18" y="603" width="314" height="36" rx="8" fill="#8B4F2B" stroke="#8B4F2B"/><text x="30" y="627" font-size="13" fill="#FFFDF7" font-weight="400">追加の希望を伝える →</text></g><text x="822" y="98" font-size="14" fill="#8B4F2B" font-weight="600">追加会話 P2</text></svg>
